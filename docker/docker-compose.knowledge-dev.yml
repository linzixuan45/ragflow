# -----------------------------------------------------------------------------
# Knowledge-base development overlay for the 企业知识库 v3.0 project.
#
# This file is consumed in addition to the official RAGFlow compose:
#
#   cd /home/speedbot/Project/ragflow/docker
#   docker compose \
#     --env-file .env.knowledge-dev \
#     -f docker-compose.yml \
#     -f docker-compose.knowledge-dev.yml \
#     --profile elasticsearch \
#     --profile gpu \
#     up -d
#
# The overlay is intentionally thin and only changes:
#   1. Forces the GPU server and removes CPU server from the default flow.
#   2. Keeps the Web UI on loopback and publishes the API locally and on LAN.
#   3. Clears host port mappings for MySQL / MinIO. Elasticsearch and Redis
#      are additionally published on loopback for host-side Python tests.
#   4. Drops the AdMindev-only flag from the GPU server command.
#   5. Adds an explicit depends_on for `ragflow-gpu` so it waits for the
#      Elasticsearch container to be healthy (not just started) before
#      running the embedded dev retriever work.
# -----------------------------------------------------------------------------

services:
  ragflow-gpu:
    # Strip the base command so the Server starts without the admin helper.
    # This keeps :9381/9382/9383/9384 quiet even if a future base file adds
    # them back. The standard entrypoint still runs task executor and API.
    command: []
    env_file:
      - .env.local
    environment:
      DEVICE: "gpu"
      ENABLE_TIMEOUT_ASSERTION: "1"
      # Per-library candidate depth = CORPUS_POOL_BUDGET_CANDIDATES // scope_count
      # (floored at MIN_RECOVERY_PER_SCOPE, capped at FALLBACK_PER_SCOPE).
      # 64 is the historical default; it is only set here explicitly so the
      # depth can be swept as a config flip instead of a code edit.
      CORPUS_POOL_BUDGET_CANDIDATES: "64"
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:9380:9380"
      - "172.16.20.102:9380:9380"
    volumes:
      # Keep the development container on the published runtime image while
      # loading the local Corpus FS implementation for restart-safe testing.
      - ../web/dist:/ragflow/web/dist:ro
      - ./nginx/ragflow.conf.python:/etc/nginx/conf.d/ragflow.conf.python:ro
      - ../api/apps/restful_apis/corpus_fs_api.py:/ragflow/api/apps/restful_apis/corpus_fs_api.py:ro
      - ../api/apps/restful_apis/keyword_search_api.py:/ragflow/api/apps/restful_apis/keyword_search_api.py:ro
      - ../agent/tools/googlescholar.py:/ragflow/agent/tools/googlescholar.py:ro
      - ../api/apps/services/corpus_citation_service.py:/ragflow/api/apps/services/corpus_citation_service.py:ro
      - ../api/apps/services/corpus_context_cache.py:/ragflow/api/apps/services/corpus_context_cache.py:ro
      - ../api/apps/services/corpus_cursor_service.py:/ragflow/api/apps/services/corpus_cursor_service.py:ro
      - ../api/apps/services/corpus_delegation_service.py:/ragflow/api/apps/services/corpus_delegation_service.py:ro
      - ../api/apps/services/corpus_fs_service.py:/ragflow/api/apps/services/corpus_fs_service.py:ro
      - ../api/apps/services/corpus_tool_service.py:/ragflow/api/apps/services/corpus_tool_service.py:ro
      - ../api/apps/services/corpus_recall_service.py:/ragflow/api/apps/services/corpus_recall_service.py:ro
      - ../api/apps/services/document_markdown_service.py:/ragflow/api/apps/services/document_markdown_service.py:ro
      - ../api/apps/services/corpus_path_service.py:/ragflow/api/apps/services/corpus_path_service.py:ro
      - ../api/apps/services/corpus_secret_service.py:/ragflow/api/apps/services/corpus_secret_service.py:ro
      - ../api/apps/services/corpus_revision_service.py:/ragflow/api/apps/services/corpus_revision_service.py:ro
      - ../api/apps/services/source_projection_service.py:/ragflow/api/apps/services/source_projection_service.py:ro
      - ../api/apps/services/keyword_search_service.py:/ragflow/api/apps/services/keyword_search_service.py:ro
      - ../api/apps/services/document_api_service.py:/ragflow/api/apps/services/document_api_service.py:ro
      - ../api/apps/services/dataset_api_service.py:/ragflow/api/apps/services/dataset_api_service.py:ro
      - ../api/db/joint_services/tenant_model_service.py:/ragflow/api/db/joint_services/tenant_model_service.py:ro
      - ../api/db/services/tenant_llm_service.py:/ragflow/api/db/services/tenant_llm_service.py:ro
      - ../api/db/services/document_service.py:/ragflow/api/db/services/document_service.py:ro
      - ../api/db/services/file_service.py:/ragflow/api/db/services/file_service.py:ro
      - ../api/db/db_models.py:/ragflow/api/db/db_models.py:ro
      - ../common/misc_utils.py:/ragflow/common/misc_utils.py:ro
      - ../common/mineru_formats.py:/ragflow/common/mineru_formats.py:ro
      - ../common/onnx_utils.py:/ragflow/common/onnx_utils.py:ro
      - ../common/settings.py:/ragflow/common/settings.py:ro
      - ../deepdoc/parser/mineru_parser.py:/ragflow/deepdoc/parser/mineru_parser.py:ro
      - ../deepdoc/vision/ocr.py:/ragflow/deepdoc/vision/ocr.py:ro
      - ../rag/llm/embedding_model.py:/ragflow/rag/llm/embedding_model.py:ro
      - ../rag/llm/ocr_model.py:/ragflow/rag/llm/ocr_model.py:ro
      - ../rag/llm/rerank_model.py:/ragflow/rag/llm/rerank_model.py:ro
      - ../rag/nlp/search.py:/ragflow/rag/nlp/search.py:ro
      - ../rag/nlp/query.py:/ragflow/rag/nlp/query.py:ro
      - ../rag/prompts/generator.py:/ragflow/rag/prompts/generator.py:ro
      - ../rag/utils/es_conn.py:/ragflow/rag/utils/es_conn.py:ro
      - ../rag/utils/chunk_metrics.py:/ragflow/rag/utils/chunk_metrics.py:ro
      - ../rag/utils/mineru_adapter.py:/ragflow/rag/utils/mineru_adapter.py:ro
      - ../rag/utils/source_projection.py:/ragflow/rag/utils/source_projection.py:ro
      - ../rag/app/naive.py:/ragflow/rag/app/naive.py:ro
      - ../rag/app/parser_router.py:/ragflow/rag/app/parser_router.py:ro
      - ../rag/flow/parser/parser.py:/ragflow/rag/flow/parser/parser.py:ro
      - ../rag/flow/parser/utils.py:/ragflow/rag/flow/parser/utils.py:ro
      - ../api/utils/validation_utils.py:/ragflow/api/utils/validation_utils.py:ro
      - ../rag/graphrag/chat_llm.py:/ragflow/rag/graphrag/chat_llm.py:ro
      - ../rag/graphrag/graph_text.py:/ragflow/rag/graphrag/graph_text.py:ro
      - ../rag/graphrag/light/graph_extractor.py:/ragflow/rag/graphrag/light/graph_extractor.py:ro
      - ../rag/graphrag/light/graph_prompt.py:/ragflow/rag/graphrag/light/graph_prompt.py:ro
      - ../rag/graphrag/general/index.py:/ragflow/rag/graphrag/general/index.py:ro
      - ../rag/llm/chat_model.py:/ragflow/rag/llm/chat_model.py:ro
      - ../rag/svr/task_executor.py:/ragflow/rag/svr/task_executor.py:ro
      - ../rag/svr/task_executor_refactor/chunk_builder.py:/ragflow/rag/svr/task_executor_refactor/chunk_builder.py:ro
      - ../rag/svr/task_executor_refactor/chunk_service.py:/ragflow/rag/svr/task_executor_refactor/chunk_service.py:ro
      - ../rag/svr/task_executor_refactor/task_handler.py:/ragflow/rag/svr/task_executor_refactor/task_handler.py:ro
      - ../rag/svr/task_executor_refactor/dataflow_service.py:/ragflow/rag/svr/task_executor_refactor/dataflow_service.py:ro
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy

  es01:
    # Host-side unit tests load conf/service_conf.yaml and use localhost:1200.
    # Bind loopback only so Elasticsearch remains private to this machine.
    ports: !override
      - "127.0.0.1:1200:9200"

  mysql:
    ports: !reset []

  minio:
    ports: !reset []

  redis:
    # SpeedML no longer owns 6379; publish RAGFlow's password-protected Redis
    # only on loopback so conf/service_conf.yaml resolves to this instance.
    ports: !override
      - "127.0.0.1:6379:6379"
