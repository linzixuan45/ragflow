name: lint

# The local gate is lefthook over *staged* files. CI mirrors that scope on
# purpose: the repository carries pre-existing lint debt, so running these
# tools over the whole tree would fail on day one and be ignored. Changed files
# are held to the same rules the hook applies.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.1" # keep in sync with uv.lock; the guard job below fails otherwise

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changed.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: List changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          files="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD)"
          echo "Comparing ${base}..HEAD ($(printf '%s\n' "${files}" | grep -c . ) files)"
          {
            echo "files<<EOF"
            printf '%s\n' "${files}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  file-checks:
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository file checks
        env:
          CHECK_FILES_FILES: ${{ needs.changed-files.outputs.files }}
        run: |
          # Mirrors the check_files.py jobs in lefthook.yml, nothing more:
          # `comment-ascii` exists in the script but no pipeline runs it.
          status=0
          for check in eof trailing-whitespace mixed-line-ending \
                       merge-conflict json yaml case-conflict symlinks; do
            echo "::group::${check}"
            python3 tools/hooks/check_files.py "${check}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  python-lint:
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff version must match uv.lock
        run: |
          if ! grep -q "name = \"ruff\"$" uv.lock; then
            echo "ruff is not pinned in uv.lock" >&2
            exit 1
          fi
          if ! grep -A2 "name = \"ruff\"$" uv.lock | grep -q "version = \"${RUFF_VERSION}\""; then
            echo "workflow pins ruff ${RUFF_VERSION}, uv.lock disagrees:" >&2
            grep -A2 "name = \"ruff\"$" uv.lock >&2
            exit 1
          fi

      - name: Install ruff
        run: python3 -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: Ruff check and format on changed files
        env:
          CHECK_FILES_FILES: ${{ needs.changed-files.outputs.files }}
        run: |
          printf '%s\n' "${CHECK_FILES_FILES}" | grep '\.py$' > /tmp/changed-py.txt || true
          if [ ! -s /tmp/changed-py.txt ]; then
            echo "No changed Python files."
            exit 0
          fi
          cat /tmp/changed-py.txt
          xargs -a /tmp/changed-py.txt ruff check
          xargs -a /tmp/changed-py.txt ruff format --check

  go-format:
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt on changed files
        env:
          CHECK_FILES_FILES: ${{ needs.changed-files.outputs.files }}
        run: |
          printf '%s\n' "${CHECK_FILES_FILES}" | grep '\.go$' > /tmp/changed-go.txt || true
          if [ ! -s /tmp/changed-go.txt ]; then
            echo "No changed Go files."
            exit 0
          fi
          cat /tmp/changed-go.txt
          unformatted="$(gofmt -l $(cat /tmp/changed-go.txt))"
          if [ -n "${unformatted}" ]; then
            echo "Not gofmt'd:" >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
